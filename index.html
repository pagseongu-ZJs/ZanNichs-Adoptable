<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adoptable Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans+Thai:wght@400;500;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('aa-theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
<style>
:root{--bg:#ececee;--ink:#111;--mut:#6b6b73;--line:#c9c9ce;--pan:#fff;--lime:#cbf33c;--red:#ff3b2f;--org:#ff7a1a;--amb:#f5b50a;--grn:#1fb865;--d:'Barlow Condensed','Noto Sans Thai',sans-serif}
:root[data-theme=dark]{--bg:#101113;--ink:#f1f1f3;--mut:#9a9aa3;--line:#33343a;--pan:#1a1b1f;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 'Noto Sans Thai','Noto Sans SC',system-ui,sans-serif}
.sub{font-weight:400;opacity:.62;font-size:.82em;margin-left:.25em}
.hidden{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1.5px solid var(--ink);background:transparent;padding:7px 13px;border-radius:4px;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{background:var(--ink);color:var(--bg)}.btn.sm{padding:3px 9px;font-size:12px}
.btn.pri{background:var(--lime);color:#111;border-color:var(--lime)}.btn.pri:hover{filter:brightness(.92);color:#111;background:var(--lime)}
.btn.dng:hover{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.3;pointer-events:none}
input,select,textarea{width:100%;background:var(--pan);border:1.5px solid var(--line);border-radius:4px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ink)}textarea{min-height:76px;resize:vertical}
select option{background:var(--pan)}input[type=checkbox]{width:auto}
/* nav */
.nav{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:10px clamp(12px,3vw,40px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit;font:800 20px var(--d);letter-spacing:1px}
.logo b{background:var(--ink);color:var(--lime);padding:0 7px;border-radius:3px}
.links{display:flex;gap:4px;margin-left:auto}.links a{color:inherit;text-decoration:none;padding:5px 12px;font-weight:600;border-radius:99px}.links a:hover{background:var(--ink);color:var(--bg)}
.ctl{display:flex;gap:8px;align-items:center;position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--pan);border:1.5px solid var(--ink);border-radius:6px;padding:6px;min-width:250px;z-index:40;display:grid;gap:2px}
.menu button{text-align:left;border:0;background:none;padding:8px 10px;border-radius:4px;cursor:pointer}.menu button:hover,.menu .on{background:var(--ink);color:var(--bg)}
.wrap{max-width:1300px;margin:auto;padding:0 clamp(14px,3vw,40px)}
/* hero */
.hero{position:relative;overflow:hidden;padding:48px 0 34px;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--line) 40%,transparent))}
.ghost{position:absolute;right:-2%;top:6px;font:800 clamp(120px,24vw,360px)/1 var(--d);color:transparent;-webkit-text-stroke:2px var(--line);opacity:.7;pointer-events:none}
.live{display:inline-block;background:var(--red);color:#fff;font:700 11px var(--d);letter-spacing:1.5px;padding:2px 10px;border-radius:99px}
h1{font:800 clamp(52px,10vw,120px)/.9 var(--d);margin:12px 0;letter-spacing:1px;position:relative}
h1 mark{background:var(--lime);color:#111;padding:0 .12em;margin-left:-.05em}
.hero p{max-width:520px;color:var(--mut);margin:0 0 24px;position:relative}
.stats{display:grid;grid-template-columns:repeat(6,1fr);border:1.5px solid var(--ink);background:var(--pan);position:relative}
.st{padding:12px 14px;border-right:1px solid var(--line);cursor:pointer;transition:.15s}.st:hover{background:color-mix(in srgb,var(--lime) 35%,transparent)}.st.sel{background:var(--lime);color:#111}.st.sel small{color:#333}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px var(--lime)}100%{box-shadow:0 0 0 0 transparent}}.card.flash{animation:flash 1.8s ease-out;border-color:var(--ink)}.cs{font-size:12px;color:var(--mut);margin-top:3px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;font-weight:700}.st:last-child{border:0}
.st small{color:var(--mut);display:block;font-size:12px;min-height:36px}.st b{font:800 40px/1 var(--d)}.st.hot b{color:var(--red)}
.alert{margin-top:12px;background:var(--red);color:#fff;font-weight:700;padding:10px 16px;border-radius:4px;position:relative}
.row{display:flex;gap:8px;margin-top:14px;position:relative}
/* sections */
.sec{padding:56px 0}
.sh{display:flex;justify-content:flex-end;align-items:flex-end;gap:12px;margin-bottom:26px;border-bottom:1.5px solid currentColor;padding-bottom:10px}
.sh .n{font:800 64px/.85 var(--d)}.sh small{display:block;font:700 12px var(--d);letter-spacing:2px;opacity:.7}.sh h2{margin:0;font-size:20px}
.band{background:#151517;--ink:#f1f1f3;--mut:#9a9aa3;--line:#38383e;--pan:#1f1f23;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 150px;gap:24px;align-items:start}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{font:700 12px var(--d);letter-spacing:1px;color:var(--mut);text-align:left;padding:6px 10px;border-bottom:1.5px solid var(--ink)}
td{padding:10px;border-bottom:1px dashed var(--line);vertical-align:middle}
.rk{font:800 26px var(--d);color:var(--mut)}
.lk{background:none;border:0;padding:0;font-weight:700;font-size:15px;cursor:pointer;text-align:left}.lk:hover{color:var(--lime)}
.mt{font-size:12px;color:var(--mut)}
[data-lv=red]{--c:var(--red)}[data-lv=org]{--c:var(--org)}[data-lv=amb]{--c:var(--amb)}[data-lv=grn]{--c:var(--grn)}[data-lv=none],[data-lv=done]{--c:var(--mut)}
.lt,.dl{color:var(--c);font-weight:700}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:7px}
tr[data-lv=red] td:first-child{box-shadow:inset 4px 0 var(--red)}
.pill{font-size:11px;border:1px solid var(--line);padding:1px 8px;border-radius:99px;white-space:nowrap}
.legend{margin-top:12px;font-size:12px;color:var(--mut);display:flex;gap:14px;flex-wrap:wrap}
.tl{width:100%}.tl circle{fill:#34353a;transition:.3s}.tl .r.on{fill:var(--red);filter:drop-shadow(0 0 8px var(--red))}.tl .y.on{fill:var(--amb);filter:drop-shadow(0 0 8px var(--amb))}.tl .g.on{fill:var(--grn);filter:drop-shadow(0 0 8px var(--grn))}
/* archive */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;align-items:center}.tools input{flex:1;min-width:200px}.tools select{width:auto}
.tabs{display:flex;gap:4px}.tabs button{border:0;background:none;padding:6px 16px;border-radius:99px;font-weight:700;cursor:pointer}.tabs .on{background:var(--ink);color:var(--bg)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{background:var(--pan);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;overflow:hidden;transition:.2s}.card:hover{border-color:var(--ink);transform:translateY(-3px)}
.ph{aspect-ratio:4/3;background:repeating-linear-gradient(135deg,var(--line) 0 2px,transparent 2px 12px);position:relative;display:grid;place-items:center;color:var(--mut);font:700 14px var(--d);letter-spacing:2px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;left:0;top:12px;background:#111;color:#fff;font-size:12px;padding:2px 12px 2px 10px}
.no{position:absolute;right:10px;bottom:4px;font:800 44px var(--d);color:#fff;mix-blend-mode:difference;font-style:normal}
.cb{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}.cb h3{margin:0;font-size:19px;line-height:1.25;overflow-wrap:anywhere}
.chips{display:flex;gap:4px;flex-wrap:wrap}.chips span{font-size:11px;border:1px solid var(--ink);padding:0 6px}
.seg{display:flex;gap:3px}.seg s{flex:1;height:5px;background:var(--line);transform:skewX(-20deg)}.seg .on{background:var(--ink)}
.desc{font-size:13px;color:var(--mut);max-height:60px;overflow:hidden;white-space:pre-wrap}
.acts{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}.acts .btn{flex:1;padding:5px 6px;font-size:12px;white-space:nowrap}
.card.isdone .ph img{filter:grayscale(1);opacity:.7}
.done-big{width:100%;min-height:58px;border:2px dashed var(--ink);background:transparent;border-radius:6px;font:700 17px 'Noto Sans Thai',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;transition:.15s}
.done-big::before{content:'☐';font-size:30px;line-height:1}.done-big:hover{background:color-mix(in srgb,var(--lime) 40%,transparent)}
.done-big.on{background:var(--lime);color:#111;border:2px solid #111}.done-big.on::before{content:'☑'}
.empty{text-align:center;padding:50px;color:var(--mut);border:1.5px dashed var(--line)}
footer{background:#151517;color:#9a9aa3;padding:30px 0;font-size:12px}
/* drawer & modal */
.scrim{position:fixed;inset:0;background:#000a;z-index:50;opacity:0;pointer-events:none;transition:.25s}.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1200px,100%);background:var(--bg);z-index:51;transform:translateX(100%);transition:.3s;display:flex;flex-direction:column;border-left:2px solid var(--ink)}.drawer.open{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--ink);color:var(--bg)}.dh h2{margin:0;font-size:18px}.dh .btn{border-color:var(--bg);color:var(--bg)}.dh .btn:hover{background:var(--bg);color:var(--ink)}
.db{overflow:auto;padding:20px;flex:1}.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fg .f{grid-column:1/-1}.fg label.l{display:block;font-weight:700;font-size:12px;margin-bottom:4px}
.up{display:block;border:2px dashed var(--ink);padding:16px;text-align:center;cursor:pointer;border-radius:4px}.up input{display:none}.pv{width:100%;max-height:220px;object-fit:contain;margin-top:8px}
.ck{display:flex;flex-wrap:wrap;gap:6px}.ck label{display:flex;gap:6px;align-items:center;border:1.5px solid var(--line);padding:5px 10px;border-radius:99px;cursor:pointer}.ck label:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}
.df{padding:14px 20px;border-top:1px solid var(--line);background:var(--pan);display:grid;gap:10px}.df .r2{display:flex;gap:8px}.df .r2 .pri{flex:1;padding:11px}
.mb{position:fixed;inset:0;background:#000b;z-index:60;display:grid;place-items:center;padding:14px}.modal{background:var(--bg);max-width:680px;width:100%;max-height:92vh;overflow:auto;padding:22px;border:2px solid var(--ink);border-radius:6px}
.modal h2{font:800 32px var(--d);margin:0;text-transform:uppercase}.modal h4{font:700 13px var(--d);letter-spacing:1.5px;margin:18px 0 6px;border-bottom:1px solid var(--line)}.modal img.dimg{width:100%;max-height:50vh;object-fit:contain;margin-top:10px;background:var(--line)}
.hs{list-style:none;padding:0;border-left:2px solid var(--ink);margin:0 0 0 6px}.hs li{padding:2px 0 8px 14px;position:relative;font-size:13px}.hs li::before{content:'';position:absolute;left:-6px;top:7px;width:10px;height:10px;background:var(--lime);border:2px solid var(--ink);border-radius:50%}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:6px;z-index:80;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:92vw}.toast .btn{border-color:var(--lime);color:var(--lime);padding:3px 10px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}.col h3{font:800 20px var(--d);letter-spacing:1px;margin:0 0 14px;padding-bottom:6px;border-bottom:2px solid var(--ink);text-transform:uppercase}
label.l{display:block;font-weight:700;font-size:12px;margin-bottom:4px}
.sh4{font:700 13px var(--d);letter-spacing:1.5px;margin:24px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px;text-transform:uppercase}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}.rt{position:relative;aspect-ratio:1;background:var(--line)}.rt img{width:100%;height:100%;object-fit:cover}
.x{border:0;background:#111;color:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;line-height:1;padding:0;flex:none}.rt .x{position:absolute;top:4px;right:4px}
.cv{position:absolute;left:4px;bottom:4px;background:#111;color:var(--lime);border:0;font-size:10px;padding:1px 6px;cursor:pointer}.cv.on{background:var(--lime);color:#111;font-weight:700}
.stbox{display:grid;gap:6px}.r2s{display:flex;gap:6px;justify-content:space-between;align-items:center}
.stp{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:8px;margin-top:8px;background:var(--pan)}.stp img{width:84px;height:84px;object-fit:cover;flex:none}.stp>div{flex:1;min-width:0;overflow-wrap:anywhere}
.dsum{font-weight:700;margin-bottom:8px}.dayg{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px}
.dy{border:1.5px solid var(--line);background:var(--pan);padding:4px 0;cursor:pointer;font:700 16px/1.1 var(--d);display:flex;flex-direction:column;align-items:center;border-radius:4px;color:var(--ink)}.dy small{font:500 10px 'Noto Sans Thai',sans-serif;color:var(--mut)}
.dy.on{background:var(--lime);color:#111;border-color:#111}.dy.on small{color:#333}.dy.td{outline:2px solid var(--ink);outline-offset:1px}.dy.ms{border-style:dashed;border-color:var(--red);color:var(--red)}
.stars{display:flex}.stars button{background:none;border:0;font-size:28px;color:var(--line);cursor:pointer;padding:0 2px}.stars .on{color:var(--amb)}
.mrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.mrow input{flex:1;min-width:140px;width:auto}.spk{width:100%;max-width:320px;height:70px;color:var(--ink);display:block;margin:8px 0}.mi{font-size:13px;padding:3px 0;display:flex;gap:8px;align-items:center}.mi b{color:var(--amb)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}.gal img{width:100%;aspect-ratio:1;object-fit:cover}
.qu{border:1.5px solid var(--ink);background:var(--pan);padding:4px 14px 14px;margin:12px 0;border-radius:6px}.qu h4{border:0}.qu .l{margin-top:12px}.card .ph,.card .cb h3{cursor:pointer}.modal.wide{max-width:1040px}.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:10px;align-items:start}.dgrid h4{margin-top:0}.dgrid .stp img{width:110px;height:110px}
.stp.now{border-color:var(--ink);box-shadow:inset 4px 0 var(--lime)}.nowb{background:var(--lime);color:#111;padding:0 6px;font-size:11px;border-radius:3px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.mhead h2{font-size:28px}
.xr{display:flex;gap:8px;align-items:flex-start;padding:10px;border:1.5px solid var(--line);margin-bottom:6px;cursor:pointer;border-radius:4px;font-weight:600}.xr:has(input:checked){border-color:var(--ink);background:color-mix(in srgb,var(--lime) 35%,transparent)}
.modal textarea,.modal input[type=text]{margin-bottom:8px}
@media(max-width:900px){.cols,.dgrid{grid-template-columns:1fr}}
@media(max-width:900px){.links{display:none}.ctl{margin-left:auto}.stats{grid-template-columns:repeat(3,1fr)}.st{border-bottom:1px solid var(--line)}.two{grid-template-columns:1fr}.tl{max-width:90px}}
@media(max-width:700px){thead{display:none}table,tbody,tr,td{display:block}tr{border:1px solid var(--line);margin-bottom:10px;padding:8px}td{border:0;padding:3px 6px}.fg{grid-template-columns:1fr}.logo span{display:none}}
</style>
</head>

function wrapT(c,text,w){const out=[];for(const para of String(text).split('\n')){let line='';for(const s of segs(para)){if(line&&c.measureText(line+s).width>w){out.push(line.trimEnd());line=s.trimStart()}else line+=s}out.push(line)}return out}

function quick(r){return `<div class="qu"><h4>${tH('qtitle')}</h4><div class="fg"><div><label class="l">${tH('l_status')}</label><select data-q="status">${STATUS.map(s=>`<option value="${esc(s)}"${s===r.status?' selected':''}>${esc(t(s))}</option>`).join('')}</select></div><div><label class="l">${tH('l_deadline')}</label><input type="date" data-q="deadline" value="${esc(r.deadline||'')}"></div></div>
<label class="l">${tH('sec_days')}</label>${daysHTML(r.deadline,r.createdDate,r.dayChecks||{},true)}
<label class="l">${tH('l_checklist')}</label><div class="ck">${CHECKS.map(c=>`<label><input type="checkbox" data-q="chk" value="${esc(c)}"${(r.checklist||[]).includes(c)?' checked':''}> ${tH(c)}</label>`).join('')}</div>
<label class="l">${tH('sec_steps')}</label><textarea id="qNote" data-q="note" style="min-height:52px" placeholder="${esc(t('st_note'))}">${esc(qNoteKeep)}</textarea><div class="r2s"><label class="btn sm" for="qImg">${tH('pick2')}<input type="file" id="qImg" accept="image/*" hidden></label><button type="button" class="btn sm pri" data-e="qstep">${tH('st_add')}</button></div>${qImgData?`<img class="pv" src="${qImgData}" alt="">`:''}
<label class="l">${tH('sec_mood')}</label><div class="mrow"><div class="stars">${[1,2,3,4,5].map(n=>`<button type="button" class="${n<=qScore?'on':''}" data-e="qstar" data-k="${n}">★</button>`).join('')}</div><input type="text" id="qMNote" placeholder="${esc(t('mood_note'))}"><button type="button" class="btn sm pri" data-e="qmood">${tH('mood_add')}</button></div>${(r.mood||[]).length?spark(r.mood):''}</div>`}
async function upd(fn){const r=R.find(x=>x.id===MID);if(!r)return;const m0=document.querySelector('.modal'),sc=m0?m0.scrollTop:0,o={status:r.status,deadline:r.deadline||'',ns:(r.steps||[]).length};fn(r);r.updatedAt=Date.now();const h=(r.history=r.history||[]),now=Date.now();if(o.status!==r.status)h.push({at:now,k:'h_status',a:o.status,b:r.status});if(o.deadline!==(r.deadline||''))h.push({at:now,k:'h_dl',a:o.deadline||'-',b:r.deadline||'-'});if((r.steps||[]).length>o.ns)h.push({at:now,k:'h_step'});await put(r);await render();details(R.find(x=>x.id===MID));const m=document.querySelector('.modal');if(m)m.scrollTop=sc}
function details(r){if(MID!==r.id){qImgData=null;qNoteKeep='';qScore=0}MID=r.id;const L=(r.links||'').split('\n').map(x=>x.trim()).filter(Boolean),hs=[...(r.history||[])].reverse();
const hl=h=>`<b>${tH(h.k)}</b>${h.k==='h_status'?': '+tH(h.a)+' → '+tH(h.b):h.k==='h_dl'?`: ${fmt(h.a)} → ${fmt(h.b)}`:h.k==='h_edit'?': '+h.f.map(x=>tH('l_'+x.replace('createdDate','createdDate'))).join(', '):''}`;
$('modalRoot').innerHTML=`<div class="mb" id="mb"><div class="modal wide" data-lv="${LV(r)}"><div style="display:flex;justify-content:space-between;gap:8px"><h2>${esc(r.name)}</h2><button class="btn" id="mc">${tH('close')}</button></div>${quick(r)}<div class="dgrid"><div>${(r.refs||(r.image?[r.image]:[])).length?`<div class="gal">${(r.refs||[r.image]).map(x=>`<img src="${x}" alt="">`).join('')}</div>`:''}</div><div>${stepsPanel(r)}</div></div><p>${tH(r.status)} · ${tH(r.kind)}${r.price?' · ฿'+esc(r.price):''}<br><span class="dl"><i class="dot"></i>${fmt(r.deadline)} · ${dtxt(r)}</span></p><p>${esc(r.theme||'-')} · ${esc(r.palette||'-')}</p><h4>${tH('l_description')}</h4><p style="white-space:pre-wrap">${esc(r.description||'-')}</p><h4>${tH('l_notes')}</h4><p style="white-space:pre-wrap">${esc(r.notes||'-')}</p>${L.length?`<h4>${tH('l_links')}</h4>`+L.map(l=>{let u;try{const x=new URL(l);if(/^https?:$/.test(x.protocol))u=x.href}catch{}return u?`<div><a href="${esc(u)}" target="_blank" rel="noopener">${esc(l)}</a></div>`:`<div>${esc(l)}</div>`}).join(''):''}<h4>${tH('hist')}</h4><ul class="hs">${hs.map(h=>`<li><span class="mt">${new Date(h.at).toLocaleString('th-TH')}</span><br>${hl(h)}</li>`).join('')||'<li>-</li>'}</ul><div style="display:flex;gap:6px;margin:16px 0 10px"><button class="btn" data-a="sall" data-id="${r.id}">${tH('sall')}</button><button class="btn" data-a="edit" data-id="${r.id}">${tH('edit')}</button></div>${dOnBtn(r)}</div></div>`;
$('mc').onclick=()=>$('modalRoot').innerHTML='';$('mb').onclick=e=>{if(e.target.id==='mb')$('modalRoot').innerHTML=''}}
document.addEventListener('click',async e=>{
const sf=e.target.closest('[data-sf]');if(sf){const k=sf.dataset.sf;statF=(statF===k||k==='s1')?null:k;tab='all';$('search').value='';$('fStatus').value='all';buildSels();await render();document.getElementById('s3').scrollIntoView({behavior:'smooth'});return}
if(e.target.closest('[data-clr]')){statF=null;return render()}
const tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;buildSels();return render()}
const lb=e.target.closest('#langMenu button');if(lb){LANG=lb.dataset.l;ls('aa-lang',LANG);$('langMenu').classList.add('hidden');return applyLang()}
if(!e.target.closest('.ctl'))$('langMenu').classList.add('hidden');
const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const r=R.find(x=>x.id===b.dataset.id);if(!r)return;const a=b.dataset.a,inModal=!!b.closest('.modal');
if(a==='goto'){if(statF||tab!=='all'||$('search').value||$('fStatus').value!=='all'){statF=null;tab='all';$('search').value='';$('fStatus').value='all';buildSels();await render()}const el=document.getElementById('c-'+r.id);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}return}
if(a==='view')details(r);if(a==='edit')openDrawer(r);if(a==='sall')openExport(r);if(a==='setcur'){r.curStep=b.dataset.sid;await put(r);await render();details(R.find(x=>x.id===r.id))}
if(a==='done'){const u=await toggleDone(r.id);if(inModal&&u)details(u)}
if(a==='del'&&confirm(t('cf')+`\n“${r.name}”`)){await rem(r.id);await render()}});
$('modalRoot').addEventListener('click',async e=>{const b=e.target.closest('.qu [data-e]');if(!b||!MID)return;const a=b.dataset.e,k=b.dataset.k;
if(a==='day')return upd(r=>{r.dayChecks=r.dayChecks||{};if(r.dayChecks[k])delete r.dayChecks[k];else r.dayChecks[k]=true});
if(a==='qstar'){qScore=+k;qNoteKeep=($('qNote')||{}).value||'';return details(R.find(x=>x.id===MID))}
if(a==='qstep'){const n=($('qNote').value||'').trim();if(!qImgData&&!n)return;const im=qImgData;qImgData=null;qNoteKeep='';return upd(r=>{const sid=crypto.randomUUID();(r.steps=r.steps||[]).push({id:sid,at:Date.now(),img:im,note:n});r.curStep=sid})}
if(a==='qmood'){if(!qScore)return;const n=($('qMNote').value||'').trim(),sc=qScore;qScore=0;return upd(r=>{(r.mood=r.mood||[]).push({at:Date.now(),score:sc,note:n})})}});
$('modalRoot').addEventListener('input',e=>{if(e.target.id==='qNote')qNoteKeep=e.target.value});
$('modalRoot').addEventListener('change',async e=>{const x=e.target;if(!MID||!x.closest('.qu'))return;
if(x.id==='qImg'){const f=x.files[0];if(f&&f.type.startsWith('image/')){qImgData=await rd(f);qNoteKeep=($('qNote')||{}).value||'';details(R.find(y=>y.id===MID))}return}
if(x.dataset.q==='status')return upd(r=>{r.status=x.value});
if(x.dataset.q==='deadline')return upd(r=>{r.deadline=x.value});
if(x.dataset.q==='chk')return upd(r=>{r.checklist=[...document.querySelectorAll('.qu [data-q=chk]:checked')].map(i=>i.value)})});
/* ---- wiring ---- */
function applyLang(){document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=tH(e.dataset.i));document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));buildSels();paintDone();paintTitle();paintDays();paintMood();paintSteps();paintRefs();document.querySelectorAll('#langMenu button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));if(db)render()}
$('f').onsubmit=submit;$('newBtn').onclick=()=>openDrawer();$('closeBtn').onclick=closeDrawer;$('scrim').onclick=closeDrawer;$('clearBtn').onclick=reset;
$('doneBtn').onclick=()=>{done=!done;paintDone()};
$('langBtn').onclick=()=>$('langMenu').classList.toggle('hidden');
$('themeBtn').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;ls('aa-theme',n)};
['search','fStatus','sortBy'].forEach(i=>$(i).addEventListener(i==='search'?'input':'change',render));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();$('modalRoot').innerHTML='';$('langMenu').classList.add('hidden')}});
$('imageFile').onchange=async e=>{for(const f of e.target.files){if(!f.type.startsWith('image/'))continue;if(f.size>12*1048576){notify('> 12 MB');continue}refs.push(await rd(f))}e.target.value='';paintRefs()};
$('stImg').onchange=async e=>{const f=e.target.files[0];if(f&&f.type.startsWith('image/')){sImg=await rd(f);paintStPrev()}e.target.value=''};
$('stAdd').onclick=()=>{const n=$('stNote').value.trim();if(!sImg&&!n)return;const sid=crypto.randomUUID();steps.push({id:sid,at:Date.now(),img:sImg,note:n});curS=sid;sImg=null;$('stNote').value='';paintStPrev();paintSteps()};
$('mAdd').onclick=()=>{if(!mScore)return;mood.push({at:Date.now(),score:mScore,note:$('mNote').value.trim()});$('mNote').value='';mScore=0;paintStars();paintMood()};
$('mNote').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('mAdd').click()}};
['deadline','createdDate'].forEach(i=>{$(i).addEventListener('input',paintDays);$(i).addEventListener('change',paintDays)});
$('drawer').addEventListener('click',e=>{const b=e.target.closest('[data-e]');if(!b)return;const k=b.dataset.k,a=b.dataset.e;
if(a==='rmref'){refs.splice(+k,1);paintRefs()}if(a==='cover'){refs.unshift(...refs.splice(+k,1));paintRefs()}if(a==='rmstep'){if(steps[+k].id===curS)curS=null;steps.splice(+k,1);paintSteps()}if(a==='cur'){curS=steps[+k].id;paintSteps()}if(a==='day'){if(dk[k])delete dk[k];else dk[k]=true;paintDays()}if(a==='star'){mScore=+k;paintStars()}if(a==='rmmood'){mood.splice(+k,1);paintMood()}});
$('exportBtn').onclick=()=>{dl(new Blob([JSON.stringify({app:'Adoptable Archive',version:2,exportedAt:new Date().toISOString(),records:R},null,2)],{type:'application/json'}),'adoptable-archive-backup.json')};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.records))throw Error('format');if(!confirm(`Import ${d.records.length}?`))return;for(const r of d.records)if(r&&r.id&&r.name)await put(r);await render()}catch(x){alert(x.message)}finally{e.target.value=''}};
(async()=>{try{db=await open();applyLang();reset()}catch(e){alert('IndexedDB error')}})();
})();
</script>
